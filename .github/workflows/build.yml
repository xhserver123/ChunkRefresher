name: Build & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0). Leave empty to only upload the jar as an artifact.'
        required: false
        default: ''

jobs:
  build:
    name: Build ChunkRefresher plugin jar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Paper 26.2（Minecraft Java 26.2）需要 JDK 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload plugin jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: chunkrefresher-jars
          path: build/libs/chunkrefresher-*.jar
          if-no-files-found: error

      # 仅当手动触发且填写 tag 时创建 GitHub Release
      - name: Create GitHub Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: build/libs/chunkrefresher-*.jar
          generate_release_notes: true
