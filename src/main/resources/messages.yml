# ============================================================
#  ChunkRefresher 消息文件
#  格式：MiniMessage（例如 <gray>文本</gray>、<#4ECDC4>彩色文本</#4ECDC4>）
#  占位符：统一使用 %key% 写法，由插件在发送前替换，避免与 MiniMessage 标签冲突
#  可用占位符：
#    refreshing      -> %radius% %total% %world% %chunk-x% %chunk-z%
#    refreshing-view -> %radius% %view% %extra% %total% %world% %chunk-x% %chunk-z%
#    progress        -> %done% %total%
#    finished        -> %refreshed% %skipped% %total% %time%
#    cooldown        -> %seconds%
#    radius-clamped  -> %max%
#    invalid-radius  -> %input%
# ============================================================

# 所有消息的前缀，可留空 ""。消息体内也可用 %prefix% 引用它。
prefix: "<dark_gray>[<aqua>区块刷新</aqua>]</dark_gray> "

messages:
  refreshing-view: "<gray>正在按视距刷新：视距 <white>%view%</white> + <white>%extra%</white> → 半径 <white>%radius%</white>（共 <white>%total%</white> 个区块；世界 <white>%world%</white>，中心区块 <white>%chunk-x%, %chunk-z%</white>）…</gray>"
  refreshing: "<gray>正在刷新以你为中心、半径 <white>%radius%</white> 的区块（共 <white>%total%</white> 个；世界 <white>%world%</white>，中心区块 <white>%chunk-x%, %chunk-z%</white>）…</gray>"
  progress: "<gray>刷新进度：<white>%done%</white>/<white>%total%</white></gray>"
  finished: "<green>重新渲染完成：成功 <white>%refreshed%</white> 个区块，跳过 <white>%skipped%</white> 个（未加载或无观众），用时 <white>%time%</white> ms。</green>"
  cooldown: "<red>刷新冷却中，请等待 <white>%seconds%</white> 秒。</red>"
  already-running: "<yellow>你已有一个刷新任务正在进行，请稍候。</yellow>"
  radius-clamped: "<yellow>半径超出允许范围，已自动收敛为 <white>%max%</white>。</yellow>"
  invalid-radius: "<red>无效的半径：<white>%input%</white>（应为不小于 0 的整数）。</red>"
  no-permission: "<red>你没有权限执行该操作。</red>"
  player-only: "<red>该命令只能由玩家执行（控制台无法确定刷新中心）。</red>"
  usage: "<gray>用法：<white>/refreshchunk [半径|view|here|reload|help]</white></gray>"
  reload-success: "<green>config.yml 与 messages.yml 已重载，进行中的任务与冷却状态已重置。</green>"

help:
  - "<gray>刷新（重新发送）周围区块，让客户端重新渲染地形。</gray>"
  - "<white>/refreshchunk</white> <dark_gray>-</dark_gray> <gray>按默认模式刷新（默认：你附近全部视距 + 2 圈）</gray>"
  - "<white>/refreshchunk view</white> <dark_gray>-</dark_gray> <gray>强制按当前视距 + 配置的额外圈数刷新</gray>"
  - "<white>/refreshchunk [半径]</white> <dark_gray>-</dark_gray> <gray>按固定半径刷新（1 = 3×3 区块）</gray>"
  - "<white>/refreshchunk here</white> <dark_gray>-</dark_gray> <gray>只刷新当前所在区块</gray>"
  - "<white>/refreshchunk reload</white> <dark_gray>-</dark_gray> <gray>重载配置（需要 chunkrefresher.reload 权限）</gray>"
  - "<white>/refreshchunk help</white> <dark_gray>-</dark_gray> <gray>显示本帮助</gray>"
